name: Deploy learning app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@v4
      - name: Use the application workflow as the Pages source
        uses: actions/github-script@v7
        with:
          script: |
            const repo = { owner: context.repo.owner, repo: context.repo.repo };
            const { data: site } = await github.request('GET /repos/{owner}/{repo}/pages', repo);
            if (site.build_type !== 'workflow') {
              await github.request('PATCH /repos/{owner}/{repo}/pages', {
                ...repo,
                build_type: 'workflow',
              });
              core.info('Changed Pages source to GitHub Actions.');
            } else {
              core.info('Pages already uses GitHub Actions.');
            }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build for the repository Pages URL
        run: npm run build
        env:
          VITE_BASE_PATH: /Bai_Tap_Ve_Nha/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

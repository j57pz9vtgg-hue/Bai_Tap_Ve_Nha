name: Deploy learning app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      main_js: ${{ steps.bundle.outputs.main_js }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Check sync merges and source data preservation
        run: npm run test:sync
      - name: Build for the repository Pages URL
        run: npm run build
        env:
          VITE_BASE_PATH: /Bai_Tap_Ve_Nha/
      - name: Record the production entry point
        id: bundle
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const html = fs.readFileSync('dist/index.html', 'utf8');
          const source = html.match(/<script[^>]*src="([^"]+\.js)"/)[1];
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `main_js=${source}\n`);
          JS
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for any legacy Pages publication to finish
        uses: actions/github-script@v7
        with:
          script: |
            for (let attempt = 0; attempt < 24; attempt++) {
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner, repo: context.repo.repo,
                head_sha: context.sha, per_page: 100,
              });
              const pending = data.workflow_runs.filter(run =>
                run.id !== context.runId &&
                (run.path?.startsWith('dynamic/pages/') || run.name === 'pages build and deployment') &&
                run.status !== 'completed'
              );
              if (!pending.length) return;
              core.info('Waiting for the legacy Pages job before publishing the application.');
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            throw new Error('Legacy Pages publication did not finish within four minutes.');
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 180000
      - name: Verify the public application and its assets
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SCRIPT: ${{ needs.build.outputs.main_js }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const site = process.env.SITE_URL;
          const expected = process.env.EXPECTED_SCRIPT;
          assert.ok(expected, 'The build must provide an entry point.');
          let verified = false;
          let observed = 'No response';
          for (let attempt = 0; attempt < 24; attempt++) {
            try {
              const response = await fetch(`${site}?deployment=${process.env.GITHUB_SHA}-${attempt}`, { cache: 'no-store', signal: AbortSignal.timeout(10000) });
              const html = await response.text();
              observed = `HTTP ${response.status}; entry ${html.match(/<script[^>]*src="([^"]+)"/)?.[1] ?? 'missing'}`;
              if (response.ok && html.includes(expected) && !html.includes('/src/main.tsx')) {
                verified = true;
                break;
              }
            } catch (error) {
              console.log(`Waiting for the published site: ${error.message}`);
            }
            await new Promise(resolve => setTimeout(resolve, 5000));
          }
          if (!verified) console.error(`::error::Published application did not match ${expected}. Last response: ${observed}`);
          assert.ok(verified, 'The public site must serve the current production application.');
          for (const path of [expected, '/Bai_Tap_Ve_Nha/assets/pixel-hero.webp', '/Bai_Tap_Ve_Nha/assets/pixel-world.webp', '/Bai_Tap_Ve_Nha/assets/pixel-book.webp', '/Bai_Tap_Ve_Nha/assets/pixel-ground.webp', '/Bai_Tap_Ve_Nha/fonts/baloo2.ttf', ...['park-hero','museum-hero','island-hero','robot-lab-hero','cosmos-hero','bunny-hero','bunny-garden','prehistoric-sprites','island-sprites','robot-sprites','cosmos-sprites','bunny-sprites','crystal-world','crystal-hero','crystal-sprites','crystal-book','cloud-world','cloud-hero','cloud-sprites','cloud-book','forest-world','forest-hero','forest-sprites','forest-book','forest-logo-sign','forest-theme-sign','museum-world','museum-hero','museum-sprites','museum-book','magic-world','magic-hero','magic-sprites','magic-book','treasure-world','treasure-hero','treasure-sprites','treasure-book','cars-world','cars-hero','cars-sprites','cars-book'].map(name => `/Bai_Tap_Ve_Nha/assets/${name}.webp`)]) {
            let assetVerified = false;
            let assetError = '';
            for (let attempt = 0; attempt < 3; attempt++) {
              try {
                const response = await fetch(new URL(path, site), { signal: AbortSignal.timeout(15000) });
                assert.ok(response.ok, `HTTP ${response.status}`);
                assert.ok(Number(response.headers.get('content-length')) > 0 || (await response.arrayBuffer()).byteLength > 0, 'Empty asset');
                assetVerified = true;
                break;
              } catch (error) {
                assetError = error.message;
                if (attempt < 2) await new Promise(resolve => setTimeout(resolve, 2000));
              }
            }
            if (!assetVerified) console.error(`::error::Public asset ${path}: ${assetError}`);
            assert.ok(assetVerified, `Missing public asset: ${path}`);
          }
          console.log('Verified the live production application, JavaScript, all theme artwork and font.');
          JS
